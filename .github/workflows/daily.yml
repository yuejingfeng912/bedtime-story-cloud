name: 每日睡前故事

on:
  schedule:
    # 19:00 北京时间 = 11:00 UTC
    # 注意：GitHub 的 schedule 在整点繁忙时会延迟几分钟到十几分钟，属正常。
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      skip_tts:
        description: '只出故事文本，不做配音（排障用）'
        type: boolean
        default: false
      skip_music:
        description: '跳过配乐，只做人声'
        type: boolean
        default: false
      llm_provider:
        description: 'LLM 模式：留空=自动；none=读 stories/<日期>.json；openai=用 OPENAI_* 密钥'
        type: string
        default: ''

permissions:
  contents: write
  models: read

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: 运行流水线
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          STEPFUN_KEY:      ${{ secrets.STEPFUN_KEY }}
          OPENAI_API_KEY:   ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL:  ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL:        ${{ secrets.LLM_MODEL }}
          LLM_EFFORT:       ${{ secrets.LLM_EFFORT }}
          LLM_PROVIDER:     ${{ inputs.llm_provider }}
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GH_PAT:           ${{ secrets.GH_PAT }}
          SKIP_TTS:         ${{ inputs.skip_tts }}
          SKIP_MUSIC:       ${{ inputs.skip_music }}
        run: python run_daily.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: story-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
